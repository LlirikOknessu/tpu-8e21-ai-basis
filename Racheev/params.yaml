data_preparation:
  train_test_ratio: 0.7
  train_val_ratio: 0.9
  random_state: 67
linear_regression:
  model_name: 'LinearRegression'
decision_tree:
  DecisionTree:
    max_depth: [3, 4, 5, 6, 7 ]
    splitter: [ 'best', 'random' ]
    min_samples_split: [ 2, 3, 4 ]
    min_samples_leaf: [ 1, 2, 3, 4 ]
  RandomForest:
    n_estimators: [1, 2, 5, 10, 15]
    max_depth: [3, 4, 5, 6, 7 ]
    min_samples_split: [ 2, 3, 4, 6, 7 ]
    min_samples_leaf: [ 1, 2, 3, 4 ]
  ExtraTree:
    n_estimators: [1, 2, 5, 10, 15]
    max_depth: [3, 4, 5, 6, 7 ]
    min_samples_split: [ 2, 3, 4, 10, 15 ]
    min_samples_leaf: [ 1, 2, 3, 4, 18, 48 ]
cat_boost:
  model_name: 'CatBoostRegressor'
  CatBoostRegressor:
    'depth': [4, 6, 8]
    'learning_rate': [ 0.01, 0.05, 0.1 ]
    'iterations': [ 30, 50, 100, 200 ]
neural_net:
  model_name: 'NeuralNet'
  NeuralNet:
    'INPUT_DENSE' : 12
    'DENSE_NUMBER' : 1 #не больше 2
    'NEURONS_CNT_D1' : 12
    'NEURONS_CNT_D2' : 12
    'BATCH_SIZE' : 64 #64
    'BUFFER_SIZE' : 256 #256
    'LEARNING_RATE' : 0.002
    'EPOCHS' : 2000
