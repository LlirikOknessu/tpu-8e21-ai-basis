stages:
  data_preparation:
    cmd: python scripts/preprocess.py --input raw/insurance.csv --output data/cleaned_data.csv --max_charges 18000 --invalid_keywords 1639
    deps:
      - scripts/preprocess.py
      - raw/insurance.csv
    outs:
      - data/cleaned_data.csv

  eda:
    cmd: python scripts/eda.py --input data/cleaned_data.csv
    deps:
      - scripts/eda.py
      - data/cleaned_data.csv
    outs: []

  train_linear:
    cmd: python scripts/train_linear.py --input data/cleaned_data.csv --output models/linear_model.pkl
    deps:
      - scripts/train_linear.py
      - data/cleaned_data.csv
    outs:
      - models/linear_model.pkl

  train_linear_validation:
    cmd: python scripts/train_linear_validation.py --model models/linear_model.pkl --input data/cleaned_data.csv
    deps:
      - scripts/train_linear_validation.py
      - models/linear_model.pkl
      - data/cleaned_data.csv
    outs: []

  train_linear_prod:
    cmd: python scripts/train_linear_prod.py --src_model models/linear_model.pkl --prod_model models/prod/linear_model.pkl
    deps:
      - scripts/train_linear_prod.py
      - models/linear_model.pkl
    outs:
      - models/prod/linear_model.pkl

  train_decision_tree:
    cmd: python scripts/train_decision_tree.py --input data/cleaned_data.csv --out_model models/decision_tree.pkl
    deps:
      - scripts/train_decision_tree.py
      - data/cleaned_data.csv
    outs:
      - models/decision_tree.pkl

  train_catboost:
    cmd: python scripts/train_catboost.py --input data/cleaned_data.csv --model_path models/cat_boost.pkl
    deps:
      - scripts/train_catboost.py
      - data/cleaned_data.csv
    outs:
      - models/cat_boost.pkl

  train_mlp:
    cmd: python scripts/train_mlp.py --input data/cleaned_data.csv --model_path models/mlp.pkl
    deps:
      - scripts/train_mlp.py
      - data/cleaned_data.csv
    outs:
      - models/mlp.pkl
